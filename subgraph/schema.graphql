type Deposited @entity(immutable: true) {
  id: Bytes!
  user: Bytes! # address
  musdIn: BigInt! # uint256
  sharesOut: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

