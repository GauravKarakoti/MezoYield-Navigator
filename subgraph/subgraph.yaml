specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: YieldRouter
    network: sepolia
    source:
      address: "0x48Ffd77Fa2ff1316484c58DD1268eC8e58cF5C0F"
      abi: YieldRouter
      startBlock: 8819147
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Deposited
        - Paused
        - Rebalanced
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - StrategyAdded
        - StrategyCapUpdated
        - TargetUpdated
        - TotalCapUpdated
        - Unpaused
        - Withdrawn
      abis:
        - name: YieldRouter
          file: ./abis/YieldRouter.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256)
          handler: handleDeposited
        - event: Paused(address)
          handler: handlePaused
        - event: Rebalanced(indexed address,indexed address,uint256)
          handler: handleRebalanced
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: StrategyAdded(indexed address,uint256)
          handler: handleStrategyAdded
        - event: StrategyCapUpdated(indexed address,uint256)
          handler: handleStrategyCapUpdated
        - event: TargetUpdated(indexed address,uint256)
          handler: handleTargetUpdated
        - event: TotalCapUpdated(uint256)
          handler: handleTotalCapUpdated
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
      file: ./src/yield-router.ts
