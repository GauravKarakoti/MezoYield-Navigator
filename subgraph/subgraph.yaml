specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: BoostManager
    network: mezo-testnet
    source:
      address: "0xF9A12943C704661451A67E4346ABF298e2009352"
      abi: BoostManager
      startBlock: 8955006
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AutoBoostSet
        - LockedToVeMezo
        - MezoClaimed
        - MezoCredited
        - OperatorSet
        - OwnershipTransferred
      abis:
        - name: BoostManager
          file: ./abis/BoostManager.json
      eventHandlers:
        - event: AutoBoostSet(indexed address,bool)
          handler: handleAutoBoostSet
        - event: LockedToVeMezo(uint256,uint256)
          handler: handleLockedToVeMezo
        - event: MezoClaimed(indexed address,uint256)
          handler: handleMezoClaimed
        - event: MezoCredited(indexed address,uint256)
          handler: handleMezoCredited
        - event: OperatorSet(indexed address,bool)
          handler: handleOperatorSet
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/boost-manager.ts
  - kind: ethereum
    name: GaugeVoteModule
    network: mezo-testnet
    source:
      address: "0x751cE5d771Fac1dA6D44Ad00cCba49f312d8A322"
      abi: GaugeVoteModule
      startBlock: 8955007
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ExecutorSet
        - IntentSet
        - GaugeVoteModuleOwnershipTransferred
        - VoteCast
      abis:
        - name: GaugeVoteModule
          file: ./abis/GaugeVoteModule.json
      eventHandlers:
        - event: ExecutorSet(indexed address,bool)
          handler: handleExecutorSet
        - event: IntentSet(indexed address,address,uint256)
          handler: handleIntentSet
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: VoteCast(indexed address,address,uint256)
          handler: handleVoteCast
      file: ./src/gauge-vote-module.ts
  - kind: ethereum
    name: YieldRouter
    network: mezo-testnet
    source:
      address: "0x03dA8717595359Fed10A2676D5310f42569fD13D"
      abi: YieldRouter
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Deposited
        - Paused
        - Rebalanced
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - StrategyAdded
        - StrategyCapUpdated
        - TargetUpdated
        - TotalCapUpdated
        - Unpaused
        - Withdrawn
      abis:
        - name: YieldRouter
          file: ./abis/YieldRouter.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256)
          handler: handleDeposited
        - event: Paused(address)
          handler: handlePaused
        - event: Rebalanced(indexed address,indexed address,uint256)
          handler: handleRebalanced
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: StrategyAdded(indexed address,uint256)
          handler: handleStrategyAdded
        - event: StrategyCapUpdated(indexed address,uint256)
          handler: handleStrategyCapUpdated
        - event: TargetUpdated(indexed address,uint256)
          handler: handleTargetUpdated
        - event: TotalCapUpdated(uint256)
          handler: handleTotalCapUpdated
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
      file: ./src/yield-router.ts
  - kind: ethereum
    name: nyMUSD
    network: mezo-testnet
    source:
      address: "0x3B4A3e196D9874Bc8566A091573dA9bB444B2DC0"
      abi: nyMUSD
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - nyMUSDOwnershipTransferred
        - RouterSet
        - Transfer
      abis:
        - name: nyMUSD
          file: ./abis/nyMUSD.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: RouterSet(indexed address)
          handler: handleRouterSet
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/ny-musd.ts
